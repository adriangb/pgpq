[workspace]
members = ["core", "py", "json"]
# `core/fuzz` is a cargo-fuzz crate: it needs nightly and the libfuzzer sanitizer runtime, so it is
# its own workspace and must not be built by `cargo test` / `cargo clippy` here.
exclude = ["core/fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
# Minimum supported Rust version for the library targets. Note that the test
# suite needs a newer toolchain than this (dev-dependencies floor at 1.89).
rust-version = "1.84"

[workspace.dependencies]
arrow = ">=56.0.0"
arrow-array = ">=56.0.0"
arrow-schema = ">=56.0.0"
arrow-json = ">=56.0.0"
arrow-ipc = ">=56.0.0"
parquet = ">=56.0.0"

[profile.bench.package.pgpq]
debug = true
