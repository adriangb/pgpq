on: [push, pull_request]

name: Rust CI

jobs:
  cargo_check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check

  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test

  # https://github.com/marketplace/actions/alls-green
  check:  # This job does nothing and is only used for the branch protection
    name: pgpq Rust Check
    if: always()

    outputs:
      result: ${{ steps.all-green.outputs.result }}

    needs:
      - cargo_check
      - fmt
      - clippy
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        id: all-green
        with:
          jobs: ${{ toJSON(needs) }}

  check-version:
    name: Check if version needs release
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    outputs:
      should-release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version against latest tag
        id: check
        run: |
          CURRENT_VERSION=$(grep '^version = ' core/Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "Current version: $CURRENT_VERSION"

          # Get the latest tag for this package
          LATEST_TAG=$(git tag -l "pgpq-*" --sort=-version:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing tags found, will create release"
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            TAG_VERSION=${LATEST_TAG#pgpq-}
            echo "Latest tag version: $TAG_VERSION"
            if [ "$CURRENT_VERSION" = "$TAG_VERSION" ]; then
              echo "Version $CURRENT_VERSION already released, skipping"
              echo "should_release=false" >> $GITHUB_OUTPUT
            else
              echo "Version changed from $TAG_VERSION to $CURRENT_VERSION, will create release"
              echo "should_release=true" >> $GITHUB_OUTPUT
            fi
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - check
      - check-version
    if: ${{ github.ref == 'refs/heads/main' && needs.check-version.outputs.should-release == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: publish
          args: --package pgpq --token ${{ secrets.CRATES_TOKEN }}
