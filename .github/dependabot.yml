version: 2

# Goal: at most one open PR per ecosystem, and for Rust only when Cargo.toml
# actually has to change. Requirements in Cargo.toml are plain caret ranges
# ("60", "0.29"), so any semver-compatible release is already allowed for
# downstream users; only a new major (or 0.x minor) needs our attention.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Compatible releases are already allowed by our requirements.
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      # One PR for all breaking bumps. This also keeps the arrow family and
      # pyo3 together, which must move in lockstep.
      cargo:
        patterns: ["*"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  # Workflow actions are pinned to commit SHAs (with a `# vX.Y.Z` comment);
  # Dependabot understands and preserves that format when it bumps them.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # The uv lockfile for the dev/test environment only; it does not affect
  # what users of the published packages get, so never edit pyproject.toml.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    groups:
      python:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
