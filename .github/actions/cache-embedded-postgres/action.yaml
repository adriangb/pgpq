name: Cache embedded Postgres
description: >-
  Restore/save the Postgres binaries that postgresql_embedded downloads from
  GitHub releases, so that repeat runs never touch the (rate-limited) GitHub
  API at all. See #76.

runs:
  using: composite
  steps:
    # `postgresql_embedded` installs into `~/.theseus/postgresql/<pg version>`
    # by default, and picks the Postgres version itself, so the cache is keyed
    # on the crate version (from Cargo.lock) rather than on a Postgres version
    # we would have to keep in sync by hand.
    - name: Resolve postgresql_embedded version
      id: pg
      shell: bash
      run: |
        version="$(awk -F'"' '/^name = "postgresql_embedded"$/ { getline; print $2 }' Cargo.lock)"
        if [ -z "$version" ]; then
          echo "::error::could not find postgresql_embedded in Cargo.lock"
          exit 1
        fi
        echo "Found postgresql_embedded $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.theseus
        key: theseus-${{ runner.os }}-${{ runner.arch }}-pgembedded-${{ steps.pg.outputs.version }}
