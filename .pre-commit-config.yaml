repos:
  - repo: local
    hooks:
    - id: cargo-fmt
      name: cargo-fmt
      entry: cargo fmt
      language: system
      types: [rust]
      pass_filenames: false
    - id: cargo-clippy
      name: cargo-clippy
      # Keep the target selection in sync with the Clippy job in
      # .github/workflows/rust.yaml: `--all` skips benches and test targets.
      entry: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets -- -D warnings
      language: system
      types: [rust]
      pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^core/tests/snapshots_csv
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
