[package]
name = "pgpq-fuzz"
version = "0.0.0"
publish = false
# Kept in step with the root workspace's `[workspace.package] edition`; this
# crate is its own workspace so it cannot inherit it.
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# Kept in lockstep with the root workspace's arrow pins. This crate is its own
# workspace with its own (gitignored) lockfile, so it resolves arrow
# independently -- an open `>=56.0.0` range here could resolve to a different
# arrow major than the `pgpq` it path-depends on, and the two would not share
# types.
arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"
bytes = "1"

[dependencies.pgpq]
path = ".."

[[bin]]
name = "encode_record_batch"
path = "fuzz_targets/encode_record_batch.rs"
test = false
doc = false
bench = false

# Keep the fuzz crate out of the main workspace: it needs a nightly toolchain and the
# `libfuzzer-sys` sanitizer runtime, neither of which should affect `cargo test` on stable.
[workspace]
members = ["."]
