[package]
name = "pgpq"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
description = "Encode Apache Arrow `RecordBatch`es to Postgres' native binary format"
license = "MIT"
readme = "README.md"
exclude = ["/tests"]
homepage = "https://github.com/adriangb/pgpq"
repository = "https://github.com/adriangb/pgpq"
documentation = "https://github.com/adriangb/pgpq/blob/workspaces/core/README.md"
authors = ["Adrian Garcia Badaracco <dev@adriangb.com>"]

[dependencies]
bytes = "^1.4.0"
arrow-schema.workspace = true
# `default-features = false` lives on `[workspace.dependencies.arrow-array]`;
# repeating it here is what cargo used to warn about (and ignore).
arrow-array.workspace = true
enum_dispatch = "0.3.11"
thiserror = "2.0.20"

[dev-dependencies]
rstest = "0.26.1"
parquet.workspace = true
criterion = "0.8.2"
arrow = { workspace = true, features = ["ipc"]}
arrow-ipc.workspace = true
postgres-types = {version = "0.2.14", features = ["with-chrono-0_4"]}
ureq = "3.4.0"
postgresql_embedded = { version = "0.21.0", features = ["blocking"] }
postgres = "0.19.12"
similar = "3.1.2"
console = "0.16.2"
chrono = { version = "0.4.34", default-features = false, features = ["std"] }
rust_decimal = { version = "1.36", features = ["db-postgres"] }
proptest = ">=1.4.0"

[[bench]]
name = "yellow_cab_dataset"
harness = false

[[bench]]
name = "experiments"
harness = false
